<!DOCTYPE html>
<html lang="en" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}HyperionOS{% endblock %}</title>
    <!-- <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script> -->
    <link rel="stylesheet" href="/static/css/tailwind.css">
    <link rel="stylesheet" href="/static/css/fontawesome.min.css">
    <link rel="stylesheet" href="/static/css/style.css">
    <link rel="stylesheet" href="/static/css/responsive.css">
    <script src="/static/js/htmx.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>

    <script>
        const uiCfg = JSON.parse(localStorage.getItem('HYPERION_UI')) || { 
            cardHex: '#0f172a', cardOp: 0.6, cardBlur: 12, textHex: '#f1f5f9' 
        };
        
        const hexToRgba = (hex, alpha) => {
            let r = parseInt(hex.slice(1, 3), 16), g = parseInt(hex.slice(3, 5), 16), b = parseInt(hex.slice(5, 7), 16);
            return `rgba(${r}, ${g}, ${b}, ${alpha})`;
        };

        document.documentElement.style.setProperty('--theme-card-bg', hexToRgba(uiCfg.cardHex, uiCfg.cardOp));
        document.documentElement.style.setProperty('--theme-card-blur', uiCfg.cardBlur + 'px');
        document.documentElement.style.setProperty('--theme-text-main', uiCfg.textHex);
    </script>
</head>

<body class="bg-transparent text-slate-100 font-sans flex h-screen overflow-hidden selection:bg-indigo-500 selection:text-white">

    {% include 'components/sidebar.html' %}

    <main class="flex-1 overflow-y-auto bg-transparent p-8 lg:p-10 pb-4 ">
        <button id="mobile-menu-btn" class="fixed z-999 md:hidden py-2 px-3 bg-slate-800/50 hover:bg-slate-700/50 border border-slate-700/50 rounded-xl text-slate-300 transition-all cursor-pointer">
            <i class="fa fa-bars text-lg"></i>
        </button>

        {% block content %}{% endblock %}
    </main>

    <div id="global-bg" class="fixed inset-0 z-[-1] pointer-events-none" style="background-color: var(--bg-color, #0f172a); filter: brightness(var(--bg-bright, 1)); transform: translateZ(0); will-change: transform;">
        <img id="bg-img" src="" class="hidden w-full h-full object-cover" alt="Background Image">
        <video id="bg-video" src="" autoplay loop muted class="hidden w-full h-full object-cover"></video>
    </div>

    <script src="/static/js/main.js"></script>

    <script>
        const bgCfg = JSON.parse(localStorage.getItem('HYPERION_BG')) || { type: 'color', val: '#0f172a', bright: 1 };
        document.documentElement.style.setProperty('--bg-bright', bgCfg.bright);
        if(bgCfg.type === 'color') document.documentElement.style.setProperty('--bg-color', bgCfg.val);
        
        document.addEventListener('DOMContentLoaded', () => {
            const img = document.getElementById('bg-img');
            const vid = document.getElementById('bg-video');
            if (bgCfg.type === 'image' && img) {
                img.src = bgCfg.val;
                img.classList.remove('hidden');
            } else if (bgCfg.type === 'video' && vid) {
                vid.src = bgCfg.val;
                vid.classList.remove('hidden');
            }
        });

        document.addEventListener('DOMContentLoaded', () => {
            const menuBtn = document.getElementById('mobile-menu-btn');
            const sidebar = document.querySelector('aside');
            
            const overlay = document.createElement('div');
            overlay.className = 'sidebar-overlay';
            document.body.appendChild(overlay);

            const toggleSidebar = () => {
                sidebar.classList.toggle('sidebar-active');
                overlay.classList.toggle('active');
                
                const icon = menuBtn.querySelector('i');
                icon.classList.toggle('fa-bars');
                icon.classList.toggle('fa-times');
                menuBtn.classList.toggle('translate-x-64'); 
            };

            if (menuBtn) {
                menuBtn.addEventListener('click', toggleSidebar);
            }
            
            overlay.addEventListener('click', toggleSidebar);
        });
    </script>

    {% block scripts %}{% endblock %}
</body>
</html>
