<aside class="w-64 bg-slate-900/60 backdrop-blur-md border-r border-slate-800/80 flex flex-col justify-between select-none">
    <div class="flex-1 flex flex-col overflow-hidden">
        <div class="p-6 border-b border-slate-800/80 flex items-center space-x-3 shrink-0">
            <div id="sidebar-logo-box" class="w-9 h-9 bg-indigo-600 rounded-xl flex items-center justify-center font-bold text-xl shadow-lg shadow-indigo-600/30 border border-indigo-500/50 overflow-hidden shrink-0">
                <!-- Teks inisial -->
                <span id="sidebar-logo-text" class="text-white">H</span>
                <!-- Gambar Logo -->
                <img id="sidebar-logo-img" src="" class="hidden w-full h-full object-cover">
            </div>
            <span id="sidebar-brand-name" class="text-xl font-bold tracking-wider text-white truncate">HyperionOS</span>
        </div>
        <nav id="sidebar-nav" class="flex-1 p-4 space-y-1.5 text-xs font-bold overflow-y-auto"></nav>
    </div>

    <div class="p-4 border-t border-slate-800/80 shrink-0">
        <a href="/logout" class="flex items-center space-x-3 px-4 py-3 text-rose-400 hover:bg-rose-500/10 rounded-xl transition text-xs font-bold border border-transparent hover:border-rose-500/20">
            <i class="fa fa-sign-out w-5 text-base"></i><span>Logout</span>
        </a>
    </div>
</aside>

<script>

const brandCfg = JSON.parse(localStorage.getItem('HYPERION_BRAND')) || { name: 'HyperionOS', type: 'text', url: '' };
    
    const brandNameEl = document.getElementById('sidebar-brand-name');
    const logoBoxEl = document.getElementById('sidebar-logo-box');
    const logoTextEl = document.getElementById('sidebar-logo-text');
    const logoImgEl = document.getElementById('sidebar-logo-img');

    // 1. Set teks nama aplikasi di samping logo
    brandNameEl.innerText = brandCfg.name;

    // 2. Logika Teks vs Gambar
    if (brandCfg.type === 'image' && brandCfg.url) {
        // Mode Gambar: Kosongin teks inisial APP_NAME, munculin gambar
        logoTextEl.classList.add('hidden');
        logoImgEl.src = brandCfg.url;
        logoImgEl.classList.remove('hidden');
        
        // Ilangin style kotak indigo bawaan biar gambar transparan lu makin kece
        logoBoxEl.classList.replace('bg-indigo-600', 'bg-transparent');
        logoBoxEl.classList.remove('border', 'shadow-lg'); 
    } else {
        // Mode Teks: Ambil huruf pertama dari APP_NAME
        logoImgEl.classList.add('hidden');
        logoTextEl.classList.remove('hidden');
        logoTextEl.innerText = brandCfg.name.charAt(0).toUpperCase(); 
        
        // Balikin style kotak indigo bawaan
        logoBoxEl.classList.replace('bg-transparent', 'bg-indigo-600');
        logoBoxEl.classList.add('border', 'shadow-lg');
    }

document.addEventListener('DOMContentLoaded', async () => {
    const nav = document.getElementById('sidebar-nav');
    const currentPath = window.location.pathname;
    const activePage = '{{ active_page | default("dashboard") }}'; 

    try {
        let menus = JSON.parse(sessionStorage.getItem('hyperion_menus'));
        if (!menus) {
            const res = await fetch('/static/menu.json');
            menus = await res.json();
            sessionStorage.setItem('hyperion_menus', JSON.stringify(menus));
        }
        
        menus.forEach(menu => {
            if (menu.sub) {
                const isSubActive = menu.id === activePage || menu.sub.some(s => s.id === activePage || currentPath === s.url);
                const details = document.createElement('details');
                details.className = "group [&_summary::-webkit-details-marker]:hidden";
                if (isSubActive) details.open = true;

                details.innerHTML = `
                    <summary class="flex items-center justify-between px-4 py-3 rounded-xl cursor-pointer transition ${isSubActive ? 'bg-indigo-600/10 border border-indigo-500/20' : 'hover:bg-slate-800/50'}">
                        <div class="flex items-center space-x-3 ${isSubActive ? 'text-indigo-300' : 'text-slate-400 group-open:text-indigo-300'}">
                            <i class="fa ${menu.icon} w-5 text-base"></i>
                            <span class="font-bold">${menu.label}</span>
                        </div>
                        <i class="fa fa-chevron-down text-xs ${isSubActive ? 'text-indigo-400' : 'text-slate-500'} group-open:rotate-180 transition-transform duration-300"></i>
                    </summary>
                    <div class="pl-11 pr-4 py-2 space-y-1.5 mt-1">
                        ${menu.sub.map(s => {
                            const isItemActive = activePage === s.id || currentPath === s.url;
                            return `
                            <a href="${s.url}" class="flex items-center px-3 py-2 rounded-lg text-xs font-bold transition ${isItemActive ? 'text-indigo-400 bg-indigo-500/10 shadow-inner' : 'text-slate-400 hover:text-white hover:bg-slate-800/50'}">
                                <i class="fa ${s.icon} w-4 mr-2"></i> ${s.label}
                            </a>
                            `;
                        }).join('')}
                    </div>
                `;
                nav.appendChild(details);
            } else {
                const isActive = activePage === menu.id || currentPath === menu.url;
                const a = document.createElement('a');
                a.href = menu.url;
                a.className = `flex items-center space-x-3 px-4 py-3 rounded-xl transition ${isActive ? 'bg-indigo-600/20 text-indigo-300 border border-indigo-500/30 shadow-inner' : 'text-slate-400 hover:bg-slate-800/50 hover:text-white'}`;
                a.innerHTML = `<i class="fa ${menu.icon} w-5 text-base"></i><span>${menu.label}</span>`;
                nav.appendChild(a);
            }
        });
    } catch (e) {
        console.error("Gagal load menu.json", e);
    }
});
</script>
