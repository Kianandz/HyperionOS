<div class="bg-slate-900/40 backdrop-blur-md border border-slate-800/60 p-4 sm:p-5 rounded-2xl space-y-4 shadow-xl">
    <h2 class="text-sm font-bold text-white border-b border-slate-800/60 pb-3 flex items-center gap-2">
        <i class="fa fa-clock text-blue-400"></i> Time & Date
    </h2>
    <form action="/settings/timezone" method="POST" class="space-y-4">
        <div>
            <label class="block font-bold text-slate-400 uppercase tracking-wider text-[10px] mb-1.5">System Timezone</label>
            <select name="timezone" class="w-full bg-slate-950/80 border border-slate-700/60 rounded-xl p-3 text-slate-200 text-xs outline-none focus:border-indigo-500">
                {% for tz in time_info.all_tz %}
                <option value="{{ tz }}" {% if tz == time_info.current_tz %}selected{% endif %}>{{ tz }}</option>
                {% endfor %}
            </select>
        </div>
        <div class="flex items-center gap-3">
            <input type="checkbox" name="ntp" value="on" id="ntp_check" class="w-4 h-4 rounded bg-slate-950 border-slate-700 accent-blue-500 cursor-pointer" {% if time_info.ntp_active %}checked{% endif %}>
            <label for="ntp_check" class="text-xs text-slate-300 font-bold cursor-pointer">Enable Network Time Protocol (NTP Sync)</label>
        </div>
        <button type="submit" class="w-full bg-blue-600 hover:bg-blue-500 active:scale-95 text-white py-2.5 rounded-xl text-xs font-bold transition shadow-lg shadow-blue-500/20 border border-blue-500/50 flex items-center justify-center gap-2 cursor-pointer">
            <i class="fa fa-save"></i> Apply Time Settings
        </button>
    </form>
</div>
