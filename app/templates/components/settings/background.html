<div class="bg-slate-900/40 backdrop-blur-md border border-slate-800/60 p-4 sm:p-5 rounded-2xl space-y-4 shadow-xl">
    <h2 class="text-sm font-bold text-white border-b border-slate-800/60 pb-3 flex items-center gap-2">
        <i class="fa fa-image text-pink-400"></i> Global Background
    </h2>
    
    <div class="flex gap-2">
        <button type="button" id="btn-type-color" onclick="setBgType('color')" class="flex-1 py-2 bg-indigo-600 text-white rounded-lg text-[10px] sm:text-xs font-bold transition cursor-pointer">Color</button>
        <button type="button" id="btn-type-image" onclick="setBgType('image')" class="flex-1 py-2 bg-slate-800 text-slate-400 hover:text-white rounded-lg text-[10px] sm:text-xs font-bold transition cursor-pointer">Image</button>
        <button type="button" id="btn-type-video" onclick="setBgType('video')" class="flex-1 py-2 bg-slate-800 text-slate-400 hover:text-white rounded-lg text-[10px] sm:text-xs font-bold transition cursor-pointer">Video</button>
    </div>

    <div id="panel-color" class="space-y-3">
        <label class="block font-bold text-slate-400 uppercase tracking-wider text-[10px]">Hex Color</label>
        <input type="color" id="bg-color-val" value="#0f172a" class="w-full h-10 rounded-xl cursor-pointer bg-transparent border border-slate-700/60">
    </div>

    <div id="panel-media" class="hidden space-y-3">
        <div class="flex items-end gap-2">
            <div class="flex-1">
                <label class="block font-bold text-slate-400 uppercase tracking-wider text-[10px] mb-1.5">Select File (Uploaded)</label>
                <select id="bg-media-select" class="w-full bg-slate-950/80 border border-slate-700/60 rounded-xl p-3 text-slate-200 text-xs outline-none focus:border-indigo-500">
                    <option value="">-- Choose Background --</option>
                    {% for bg in backgrounds %}
                    <option value="/static/uploads/backgrounds/{{ bg }}">{{ bg }}</option>
                    {% endfor %}
                </select>
            </div>
            <button type="button" onclick="document.getElementById('bg-file-input').click()" class="bg-indigo-600 hover:bg-indigo-500 text-white px-4 py-3 rounded-xl text-xs font-bold transition cursor-pointer shadow-lg shadow-indigo-500/20">
                <i class="fa fa-upload"></i> Upload
            </button>
            <input type="file" id="bg-file-input" class="hidden" accept="image/*,video/*" onchange="uploadNewBackground(this)">
        </div>

        <div>
            <label class="block font-bold text-slate-400 uppercase tracking-wider text-[10px] mb-1.5">Or Custom External URL (Optional)</label>
            <input type="text" id="bg-media-url" placeholder="https://..." class="w-full bg-slate-950/80 border border-slate-700/60 rounded-xl p-3 text-slate-200 text-xs outline-none focus:border-indigo-500">
        </div>

        <div>
            <label class="flex justify-between font-bold text-slate-400 uppercase tracking-wider text-[10px] mb-1.5">
                <span>Brightness</span> <span id="valBright">1.0</span>
            </label>
            <input type="range" id="sliderBright" min="0.1" max="1" step="0.1" value="1" oninput="document.getElementById('valBright').innerText = this.value" class="w-full accent-indigo-500 cursor-pointer">
        </div>
    </div>

    <button type="button" onclick="saveGlobalBg()" class="w-full bg-indigo-600 hover:bg-indigo-500 active:scale-95 text-white py-2.5 rounded-xl text-xs font-bold transition shadow-lg shadow-indigo-500/20 border border-indigo-500/50 mt-4 flex items-center justify-center gap-2 cursor-pointer">
        <i class="fa fa-save"></i> Apply Background
    </button>
</div>
