<!-- Card 1: Sistem DNS -->
<div class="custom-card border border-slate-800/60 p-5 rounded-2xl space-y-4 shadow-xl">
    <h2 class="text-sm font-bold text-white border-b border-slate-800/60 pb-3 flex items-center gap-2">
        <i class="fa fa-globe text-indigo-400"></i> Sistem DNS
    </h2>
    <form action="/settings/dns" method="POST" class="space-y-4 text-xs">
        <div>
            <label class="block font-bold text-slate-400 uppercase tracking-wider text-[10px] mb-1.5">Primary DNS</label>
            <input type="text" name="primary" value="1.1.1.1" class="w-full bg-slate-950/80 border border-slate-700/60 rounded-xl p-3 text-slate-200 font-mono outline-none focus:border-indigo-500 shadow-inner">
        </div>
        <div>
            <label class="block font-bold text-slate-400 uppercase tracking-wider text-[10px] mb-1.5">Secondary DNS</label>
            <input type="text" name="secondary" value="8.8.8.8" class="w-full bg-slate-950/80 border border-slate-700/60 rounded-xl p-3 text-slate-200 font-mono outline-none focus:border-indigo-500 shadow-inner">
        </div>
        <div class="pt-2">
            <button type="submit" class="bg-indigo-600 hover:bg-indigo-500 active:scale-95 text-white px-5 py-2.5 rounded-xl font-bold transition shadow-lg shadow-indigo-500/20 border border-indigo-500/50 cursor-pointer flex items-center gap-2">
                <i class="fa fa-save"></i> Apply DNS
            </button>
        </div>
    </form>
</div>
