<!-- Header -->
<div class="glass-panel border border-slate-800/80 p-5 rounded-2xl flex flex-col md:flex-row md:justify-between md:items-center shadow-xl gap-4">
    <div class="flex items-center gap-3">
        <div class="p-3 bg-indigo-500/10 border border-indigo-500/20 rounded-xl text-indigo-400">
            <i class="fa fa-cloud text-xl"></i>
        </div>
        <div>
            <h1 class="text-xl font-bold text-white tracking-wide">Cloudflare Tunnel</h1>
            <p class="text-xs text-slate-400">Tunnel Configuration & Daemon Status</p>
        </div>
    </div>
    
    <div class="flex items-center gap-3 flex-wrap">
        <div class="px-4 py-2 rounded-xl text-xs font-bold flex items-center gap-2 border {% if status.status == 'active' %}bg-emerald-500/10 text-emerald-400 border-emerald-500/20{% else %}bg-slate-800/50 text-slate-400 border-slate-700/50{% endif %}">
            <i class="fa {% if status.status == 'active' %}fa-check-circle{% else %}fa-power-off{% endif %} text-base"></i> 
            DAEMON {{ status.status|upper }}
        </div>

        <div class="w-px h-6 bg-slate-700/50 hidden md:block"></div>

        <button onclick="toggleService('start')" class="bg-emerald-600/20 hover:bg-emerald-500/30 text-emerald-400 border border-emerald-500/30 px-4 py-2 rounded-xl text-xs font-bold transition flex items-center gap-2 cursor-pointer">
            <i class="fa fa-play"></i> Start
        </button>
        <button onclick="toggleService('stop')" class="bg-rose-600/20 hover:bg-rose-500/30 text-rose-400 border border-rose-500/30 px-4 py-2 rounded-xl text-xs font-bold transition flex items-center gap-2 cursor-pointer">
            <i class="fa fa-stop"></i> Stop
        </button>
    </div>
</div>
