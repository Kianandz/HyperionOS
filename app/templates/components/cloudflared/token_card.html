<!-- KIRI: Pasang Token -->
<div class="lg:col-span-1 space-y-6">
    <div class="glass-panel border border-slate-800/60 rounded-2xl p-5 shadow-xl relative overflow-hidden group">
        <div class="absolute top-0 right-0 w-32 h-32 bg-indigo-500/5 rounded-full blur-3xl -mr-10 -mt-10 transition-all group-hover:bg-indigo-500/10"></div>
        
        <div class="flex items-center gap-3 mb-4 border-b border-slate-800/50 pb-3">
            <i class="fa fa-key text-indigo-400"></i>
            <h3 class="font-bold text-white tracking-wide text-sm">Pasang Token Baru</h3>
        </div>
        
        <p class="text-xs text-slate-400 mb-5 leading-relaxed">
            Masukkan token dari Cloudflare Zero Trust. Token baru akan menimpa konfigurasi lama.
        </p>
        
        <form action="/cloudflared/connect" method="POST" class="space-y-4">
            <div class="relative">
                <i class="fa fa-lock absolute left-3 top-2.5 text-slate-500 text-sm"></i>
                <input type="password" name="token" placeholder="eyJh..." required class="w-full bg-slate-950/60 border border-slate-700/60 focus:border-indigo-500 rounded-xl pl-9 pr-3 py-2.5 text-xs text-slate-200 font-mono shadow-inner transition-all focus:outline-none focus:ring-2 focus:ring-indigo-500/20">
            </div>
            <button type="submit" class="w-full bg-indigo-600 hover:bg-indigo-500 active:scale-95 text-white py-2.5 px-4 rounded-xl text-xs font-bold transition-all shadow-lg flex items-center justify-center gap-2 cursor-pointer">
                <i class="fa fa-download"></i> Install & Connect
            </button>
        </form>
    </div>
</div>
