<div class="space-y-4 col-span-1 flex flex-col">
    <!-- Saved Sessions Card -->
    <div class="bg-slate-900/60 backdrop-blur-2xl border border-slate-800/80 p-5 rounded-2xl shadow-2xl space-y-3">
        <div class="flex items-center justify-between">
            <h2 class="text-[11px] font-bold text-slate-400 uppercase tracking-wider">Koneksi Server</h2>
            <button onclick="openNewConnectionModal()" class="text-indigo-400 hover:text-indigo-300 text-xs flex items-center gap-1.5 font-semibold transition-colors bg-indigo-500/10 hover:bg-indigo-500/20 px-2.5 py-1 rounded-lg border border-indigo-500/20">
                <i class="fa fa-plus"></i> Baru
            </button>
        </div>
        <select id="saved-sessions-list" onchange="loadSelectedSession(this.value)" class="w-full bg-slate-950 border border-slate-800 text-slate-200 text-xs rounded-xl p-3 outline-none focus:border-indigo-500 focus:ring-1 focus:ring-indigo-500 transition-all font-mono cursor-pointer">
            <option value="">-- Pilih Sesi Tersimpan --</option>
        </select>
    </div>

    <!-- Databases & Tables Explorer Panel -->
    <div id="tables-explorer-container" class="bg-slate-900/60 backdrop-blur-2xl border border-slate-800/80 p-5 rounded-2xl shadow-2xl min-h-[400px] flex-1">
        <div class="flex flex-col items-center justify-center h-48 text-slate-500 text-xs text-center space-y-3 mt-8">
            <div class="w-12 h-12 rounded-2xl bg-slate-800/50 flex items-center justify-center border border-slate-700/50">
                <i class="fa fa-server text-xl opacity-40"></i>
            </div>
            <p class="font-medium text-slate-400">Pilih server tersimpan atau klik<br><b class="text-emerald-400">Connect Localhost</b> di atas.</p>
        </div>
    </div>
</div>
