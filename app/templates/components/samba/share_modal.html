<div id="smb-share-modal" class="fixed inset-0 z-[110] bg-slate-950/85 backdrop-blur-md hidden flex items-center justify-center p-4">
    <div class="bg-slate-900/90 backdrop-blur-xl border border-slate-700/60 rounded-2xl w-full max-w-2xl shadow-2xl overflow-hidden">
        <div class="p-4 border-b border-slate-800/80 flex justify-between items-center bg-slate-800/50">
            <h3 id="modal-share-title" class="text-indigo-300 font-bold text-sm"><i class="fa fa-folder-plus"></i> Konfigurasi Share</h3>
            <button onclick="document.getElementById('smb-share-modal').classList.add('hidden')" class="text-slate-400 hover:text-white cursor-pointer"><i class="fa fa-times"></i></button>
        </div>
        
        <div class="flex p-3 gap-2 bg-slate-950/50 border-b border-slate-800/50">
            <button type="button" onclick="switchShareTab('gui')" id="btn-tab-gui" class="flex-1 py-2 text-xs font-bold rounded-lg bg-indigo-600 text-white transition-all shadow-md cursor-pointer">Visual GUI</button>
            <button type="button" onclick="switchShareTab('advanced')" id="btn-tab-advanced" class="flex-1 py-2 text-xs font-bold rounded-lg bg-transparent text-slate-400 hover:bg-slate-800 transition-all cursor-pointer">Advanced Mode</button>
        </div>

        <form action="/files/samba/save" method="POST" class="p-5 space-y-4" id="form-share">
            <div id="tab-gui" class="space-y-4">
                <div class="grid grid-cols-2 gap-4">
                    <div>
                        <label class="block text-xs font-bold text-slate-400 mb-1.5">Nama Share</label>
                        <input type="text" name="name" id="input-share-name" required placeholder="Contoh: Media" class="w-full bg-slate-950/80 border border-slate-700/60 rounded-xl px-4 py-2.5 text-sm text-slate-200 outline-none focus:border-indigo-500">
                    </div>
                    <div>
                        <label class="block text-xs font-bold text-slate-400 mb-1.5">Path / Lokasi</label>
                        <input type="text" name="path" id="input-share-path" required placeholder="/home/..." class="w-full bg-slate-950/80 border border-slate-700/60 rounded-xl px-4 py-2.5 text-sm font-mono text-slate-200 outline-none focus:border-indigo-500">
                    </div>
                </div>
                
                <div class="grid grid-cols-2 gap-4">
                    <div>
                        <label class="block text-xs font-bold text-slate-400 mb-1.5">Deskripsi / Comment</label>
                        <input type="text" id="input-share-comment" placeholder="Folder Media Bersama" class="w-full bg-slate-950/80 border border-slate-700/60 rounded-xl px-4 py-2.5 text-sm text-slate-200 outline-none focus:border-indigo-500">
                    </div>
                    <div class="grid grid-cols-2 gap-2">
                        <div>
                            <label class="block text-[10px] font-bold text-slate-400 mb-1.5">Valid Users</label>
                            <input type="text" name="valid_users" id="input-share-users" placeholder="nanda, tamu" class="w-full bg-slate-950/80 border border-slate-700/60 rounded-xl px-3 py-2.5 text-sm text-slate-200 focus:border-indigo-500">
                        </div>
                        <div>
                            <label class="block text-[10px] font-bold text-slate-400 mb-1.5">Force User</label>
                            <input type="text" id="input-share-forceuser" placeholder="root" class="w-full bg-slate-950/80 border border-slate-700/60 rounded-xl px-3 py-2.5 text-sm text-slate-200 focus:border-indigo-500">
                        </div>
                    </div>
                </div>

                <div class="flex justify-between items-center bg-slate-950/40 rounded-xl border border-slate-800/50 p-3">
                    <div class="flex gap-4">
                        <label class="flex items-center gap-2 text-sm text-slate-300 cursor-pointer hover:text-indigo-300">
                            <input type="checkbox" name="guest_ok" id="input-share-guest" value="true" class="rounded border-slate-700 bg-slate-950 text-indigo-500 w-4 h-4 focus:ring-0"> Guest Ok
                        </label>
                        <label class="flex items-center gap-2 text-sm text-slate-300 cursor-pointer hover:text-indigo-300">
                            <input type="checkbox" name="writable" id="input-share-write" value="true" class="rounded border-slate-700 bg-slate-950 text-indigo-500 w-4 h-4 focus:ring-0"> Writable
                        </label>
                        <label class="flex items-center gap-2 text-sm text-slate-300 cursor-pointer hover:text-indigo-300">
                            <input type="checkbox" name="browseable" id="input-share-browse" value="true" checked class="rounded border-slate-700 bg-slate-950 text-indigo-500 w-4 h-4 focus:ring-0"> Browseable
                        </label>
                    </div>
                    <div class="flex gap-2 w-1/3">
                        <input type="text" name="create_mask" id="input-share-cmask" value="0755" class="w-1/2 bg-slate-950/80 border border-slate-700/60 rounded-lg px-2 py-1 text-xs text-center text-slate-400" title="Create Mask">
                        <input type="text" name="directory_mask" id="input-share-dmask" value="0755" class="w-1/2 bg-slate-950/80 border border-slate-700/60 rounded-lg px-2 py-1 text-xs text-center text-slate-400" title="Dir Mask">
                    </div>
                </div>
            </div>

            <div id="tab-advanced" class="hidden space-y-2">
                <textarea name="raw_config" id="input-share-raw" class="w-full bg-slate-950/80 border border-slate-700/60 rounded-xl px-4 py-2.5 text-xs text-green-400 font-mono h-56 focus:border-indigo-500 custom-scrollbar shadow-inner outline-none"></textarea>
            </div>

            <button type="submit" class="w-full bg-indigo-600 hover:bg-indigo-500 active:scale-95 text-white font-bold py-3 rounded-xl transition-all shadow-lg border border-indigo-500/50 text-sm cursor-pointer">
                <i class="fa fa-save mr-1"></i> Simpan Konfigurasi
            </button>
        </form>
    </div>
</div>
