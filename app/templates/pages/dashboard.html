{% extends 'layouts/base.html' %}

{% block title %}Dashboard - HyperionOS{% endblock %}

{% block content %}
<div class="space-y-6">
    <!-- Header dengan gaya Glassmorphism seperti Firewall -->
    <div class="glass-panel border border-slate-800/80 p-5 rounded-2xl flex flex-col md:flex-row md:justify-between md:items-center shadow-xl gap-4">
        <div class="flex items-center gap-3">
            <div class="p-3 bg-indigo-500/10 border border-indigo-500/20 rounded-xl text-indigo-400">
                <i class="fa fa-pie-chart text-xl"></i>
            </div>
            <div>
                <h1 class="text-xl font-bold text-white tracking-wide">System Overview</h1>
                <p class="text-xs text-slate-400">Server Monitor & Live Status</p>
            </div>
        </div>
        
        <div class="flex flex-wrap items-center gap-4">
            <div class="px-4 py-2 rounded-xl text-xs font-bold flex items-center gap-2 border bg-emerald-500/10 text-emerald-400 border-emerald-500/20 shadow-inner">
                <span class="relative flex h-2 w-2 mr-1">
                    <span class="absolute inline-flex h-full w-full animate-ping rounded-full bg-emerald-400 opacity-50"></span>
                    <span class="relative h-2 w-2 rounded-full bg-emerald-400"></span>
                </span>
                STATUS ONLINE
            </div>
        </div>
    </div>

    <!-- Area Grid Metrics (HTMX Polling) -->
    <div hx-get="/dashboard/metrics-partial" 
         hx-trigger="every 1s" 
         hx-swap="innerHTML" 
         class="grid grid-cols-1 gap-4 md:grid-cols-4 relative z-10"> 
        {% include 'components/metrics_grid.html' %}
    </div>
</div>
{% endblock %}
