{% extends 'layouts/base.html' %}
{% block title %}Terminal - HyperionOS{% endblock %}

{% block content %}
<div class="space-y-6">
    {% include 'components/terminal/container.html' %}
</div>

{% block scripts %}
<!-- Library xterm.js dan Addon buat responsive auto-fit -->
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/xterm@5.3.0/css/xterm.css" />
<script src="https://cdn.jsdelivr.net/npm/xterm@5.3.0/lib/xterm.js"></script>
<script src="https://cdn.jsdelivr.net/npm/xterm-addon-fit@0.8.0/lib/xterm-addon-fit.js"></script>
<script src="https://cdn.jsdelivr.net/npm/xterm-addon-image/lib/xterm-addon-image.js"></script>

<script>
var observer = new MutationObserver(() => {
  const el = document.querySelector('#terminal-container .terminal.xterm');

  if (el) {
    el.classList.add('p-4');
    observer.disconnect();
  }
});

observer.observe(document.body, {
  childList: true,
  subtree: true
});

</script>
<script src="/static/js/terminal/main.js"></script>
{% endblock %}
{% endblock %}
