<!DOCTYPE html>

<html lang="id" class="dark">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Login - HyperionOS</title>
    
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>

    <link rel="stylesheet" href="/static/css/fontawesome.min.css">

    <link rel="stylesheet" href="/static/css/style.css">

    <script>
        const uiCfg = JSON.parse(localStorage.getItem('HYPERION_UI')) || { 
            cardHex: '#0f172a', cardOp: 0.6, cardBlur: 12, textHex: '#f1f5f9' 
        };
        
        const hexToRgba = (hex, alpha) => {
            let r = parseInt(hex.slice(1, 3), 16), g = parseInt(hex.slice(3, 5), 16), b = parseInt(hex.slice(5, 7), 16);
            return `rgba(${r}, ${g}, ${b}, ${alpha})`;
        };

        // Set CSS Variable ke :root
        document.documentElement.style.setProperty('--theme-card-bg', hexToRgba(uiCfg.cardHex, uiCfg.cardOp));
        document.documentElement.style.setProperty('--theme-card-blur', uiCfg.cardBlur + 'px');
        document.documentElement.style.setProperty('--theme-text-main', uiCfg.textHex);
    </script>

</head>

<body class="bg-transparent text-slate-100 flex items-center justify-center h-screen selection:bg-indigo-500 selection:text-white">

    <div class="bg-slate-900/60 backdrop-blur-xl border border-slate-800/80 p-8 rounded-3xl w-full max-w-md space-y-6 shadow-2xl relative overflow-hidden">
        
        <div class="absolute top-0 right-0 w-40 h-40 bg-indigo-500/10 rounded-full blur-3xl -mr-15 -mt-15 pointer-events-none"></div>

        <div class="text-center space-y-2 relative z-10">
            <div class="w-12 h-12 bg-indigo-600 rounded-2xl flex items-center justify-center font-bold text-2xl mx-auto shadow-lg shadow-indigo-600/30 border border-indigo-500/50">H</div>

            <h1 class="text-2xl font-bold text-white tracking-wide">Hyperion<span class="text-indigo-500">OS</span></h1>

            <p class="text-slate-400 text-xs font-medium">Log in with your credentials.</p>

        </div>

        {% if error %}

        <div class="p-3.5 bg-rose-500/10 border border-rose-500/20 text-rose-400 text-xs font-bold rounded-xl flex items-center gap-2 relative z-10 shadow-inner">

            <i class="fa fa-exclamation-circle text-base"></i>

            <span>{{ error }}</span>
            
        </div>

        {% endif %}

        <form action="/login" method="POST" class="space-y-4 text-xs relative z-10">

            <div>

                <label class="block font-bold text-slate-400 uppercase tracking-wider text-[10px] mb-1.5">Username</label>

                <div class="relative">

                    <i class="fa fa-user absolute left-3.5 top-3.5 text-slate-500 text-xs"></i>

                    <input type="text" name="username" required placeholder="Username" class="w-full bg-transparent/80 border border-slate-700/60 rounded-xl pl-10 pr-4 py-3 text-white focus:outline-none focus:border-indigo-500 transition-all shadow-inner font-medium">

                </div>

            </div>

            <div>

                <label class="block font-bold text-slate-400 uppercase tracking-wider text-[10px] mb-1.5">Password</label>

                <div class="relative">

                    <i class="fa fa-lock absolute left-3.5 top-3.5 text-slate-500 text-xs"></i>

                    <input type="password" name="password" required placeholder="••••••••" class="w-full bg-transparent/80 border border-slate-700/60 rounded-xl pl-10 pr-4 py-3 text-white focus:outline-none focus:border-indigo-500 transition-all shadow-inner font-medium">

                </div>

            </div>

            <div class="pt-2">

                <button type="submit" class="w-full bg-indigo-600 hover:bg-indigo-500 active:scale-95 text-white font-bold py-3.5 rounded-xl transition-all flex justify-center items-center gap-2 shadow-lg shadow-indigo-500/20 border border-indigo-500/50 cursor-pointer">

                    <i class="fa fa-sign-in"></i> Login

                </button>

            </div>

        </form>

    </div>

</body>

<div id="global-bg" class="fixed inset-0 z-[-1] pointer-events-none transition-all duration-500" style="background-color: var(--bg-color, #0f172a); filter: brightness(var(--bg-bright, 1));">

    <img id="bg-img" src="" class="hidden w-full h-full object-cover" alt="Background Image">

    <video id="bg-video" src="" autoplay loop muted class="hidden w-full h-full object-cover"></video>

</div>

<script>

    const bgCfg = JSON.parse(localStorage.getItem('HYPERION_BG')) || { type: 'color', val: '#0f172a', bright: 1 };

    document.documentElement.style.setProperty('--bg-bright', bgCfg.bright);

    if(bgCfg.type === 'color') document.documentElement.style.setProperty('--bg-color', bgCfg.val);
    
    document.addEventListener('DOMContentLoaded', () => {

        const img = document.getElementById('bg-img');

        const vid = document.getElementById('bg-video');

        if (bgCfg.type === 'image' && img) {

            img.src = bgCfg.val;

            img.classList.remove('hidden');

        } else if (bgCfg.type === 'video' && vid) {

            vid.src = bgCfg.val;

            vid.classList.remove('hidden');

        }

    });
    
</script>

</html>
